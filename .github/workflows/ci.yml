name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/edufrench
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-for-ci-only
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SANITY_PROJECT_ID: o1fj3dj4
      NEXT_PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
